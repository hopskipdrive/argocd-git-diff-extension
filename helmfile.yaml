repositories:
  - name: argo
    url: https://argoproj.github.io/argo-helm

releases:
  - name: argo-cd
    namespace: argocd
    chart: argo/argo-cd
    version: 9.3.7
    values:
      - server:
          # Disable the chart's native extension logic (managed by initContainer below)
          extensions:
            enabled: false

          volumes:
            - name: extensions
              emptyDir: {}

          volumeMounts:
            - name: extensions
              mountPath: /app/extensions/

          # Extension installer initContainer — pulls the UI bundle from the backend service
          initContainers:
            - name: extension-installer
              image: quay.io/argoprojlabs/argocd-extension-installer:v0.0.9
              env:
                - name: EXTENSION_URL
                  value: "http://extension-backend.argocd.svc.cluster.local/static/extension.tar.gz"
              volumeMounts:
                - name: extensions
                  mountPath: /tmp/extensions/
              securityContext:
                runAsUser: 1000
                allowPrivilegeEscalation: false

      - configs:
          cm:
            # Enable the proxy extension feature
            extension.config: |
              extensions:
                - name: git-diff-extension
                  backend:
                    services:
                      - url: http://extension-backend.argocd.svc.cluster.local:80
          params:
            server.enable.proxy.extension: "true"
          rbac:
            policy.csv: |
              p, role:readonly, extensions, invoke, git-diff-extension, allow
              p, role:admin, extensions, invoke, git-diff-extension, allow

  - name: git-diff-extension
    namespace: argocd
    chart: ./chart/extension-backend
    values:
      - image:
          repository: local/argocd-diff-backend
          tag: latest
          pullPolicy: IfNotPresent
      - logLevel: info
      # For local development, set GITHUB_TOKEN via the GITHUB_TOKEN env var.
      # For production, enable externalSecret instead.
      #
      # Local dev (GitHub PAT):
      - env:
          GITHUB_TOKEN: {{ env "GITHUB_TOKEN" | default "" }}
      # Production (GitHub App via External Secrets):
      # - externalSecret:
      #     enabled: true
      #     clusterSecretStore: cluster-secret-store-internal-secretstore
