name: Release Extension

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write
  pages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: ui
        run: npm ci

      - name: Build UI (Webpack)
        working-directory: ui
        run: npm run build

      - name: Calculate Checksum
        id: checksum
        working-directory: ui/dist
        run: |
          echo "SHA=$(shasum -a 256 extension.tar | awk '{print $1}')" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ui/dist/extension.tar
          body: |
            ## ArgoCD Git Diff Extension ${{ github.ref_name }}
            
            ### Installation Info
            
            **Extension URL:** `https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/extension.tar`
            
            **Checksum (SHA256):** `${{ steps.checksum.outputs.SHA }}`
            
            **Docker Image:** `${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}`
            *(Supports linux/amd64 and linux/arm64)*

