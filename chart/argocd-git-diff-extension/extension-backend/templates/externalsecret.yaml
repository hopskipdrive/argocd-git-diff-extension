{{- if .Values.externalSecret.enabled }}
{{- if not .Values.existingSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.externalSecret.secretName | default (printf "%s-github-credentials" .Release.Name) }}
  labels:
    app: {{ .Release.Name }}-extension-backend
    app.kubernetes.io/name: extension-backend
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.externalSecret.clusterSecretStore }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.externalSecret.secretName | default (printf "%s-github-credentials" .Release.Name) }}
    creationPolicy: Owner
  data:
    {{- toYaml .Values.externalSecret.data | nindent 4 }}
{{- end }}
{{- end }}
